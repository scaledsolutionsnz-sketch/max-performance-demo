<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">

<meta name="description" content="Leave a review for Max Performance — performance tuning and auto servicing in Christchurch.">

<body style="background:var(--bone)">
<div class="rev-wrap">

    <p class="rev-note">Google review link is a placeholder for this demo — we'll connect it to your real Google Business profile.</p>

  </div>
</div>
