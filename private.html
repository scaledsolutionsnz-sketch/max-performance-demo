<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback | Max Performance, Christchurch</title>
<meta name="description" content="Private feedback for Max Performance, Christchurch.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--bone)">
<div class="rev-wrap">
  <div class="rev-card">
    <div class="mark">M</div>
    <h1>Tell us what happened</h1>
    <p>Sorry it wasn't five stars. Your feedback comes straight to the workshop so we can put it right.</p>
    <form class="form" style="text-align:left;background:transparent;border:none;padding:0" action="https://formsubmit.co/info@maxperformance.co.nz" method="POST">
      <input type="hidden" name="_subject" value="Private feedback from Max Performance website">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none">
      <div class="field"><label for="name" style="color:#333">Name (optional)</label><input id="name" name="name" type="text" style="background:#fff;color:#16181c;border-color:var(--line)"></div>
      <div class="field"><label for="email" style="color:#333">Email (optional)</label><input id="email" name="email" type="email" style="background:#fff;color:#16181c;border-color:var(--line)"></div>
      <div class="field"><label for="message" style="color:#333">What could we have done better?</label><textarea id="message" name="message" required style="background:#fff;color:#16181c;border-color:var(--line)"></textarea></div>
      <button class="btn btn--accent" type="submit">Send feedback</button>
    </form>
    <a class="back" href="index.html">← Back to home</a>
  </div>
</div>
</body>
</html>
